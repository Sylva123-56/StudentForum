spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/student_forum?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
server:
  port: 8081
  tomcat:
    # 不限制吞掉的请求体：否则超限上传会被直接断开连接，浏览器只能报 "Failed to fetch"
    max-swallow-size: -1
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
mybatis:
  configuration:
    map-underscore-to-camel-case: true
forum:
  uploads: ${UPLOAD_DIR:uploads}
  demo-password: ${DEMO_PASSWORD:}
