spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/student_forum?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
mybatis:
  configuration:
    map-underscore-to-camel-case: true
forum:
  uploads: ${UPLOAD_DIR:uploads}
  demo-password: ${DEMO_PASSWORD:}
